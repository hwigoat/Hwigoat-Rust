name: Windows precompiled installer
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create an unpublished draft release after successful build
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - hwigoat-source.zip
      - ci/**
      - .github/workflows/windows-build.yml
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          if (!(Test-Path hwigoat-source.zip)) { throw 'Upload the current hwigoat-source.zip to the repository root.' }
          Expand-Archive -LiteralPath hwigoat-source.zip -DestinationPath work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare 1.0.7 source and branding
        run: |
          python -m pip install pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
          python ci/prepare_103.py work
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation failed' }
          python ci/prepare_104.py work
          if ($LASTEXITCODE -ne 0) { throw '1.0.4 source preparation failed' }
          python ci/prepare_105.py work
          if ($LASTEXITCODE -ne 0) { throw '1.0.5 source preparation failed' }
          python ci/prepare_106.py work
          if ($LASTEXITCODE -ne 0) { throw '1.0.6 source preparation failed' }
          python ci/prepare_107.py work
          if ($LASTEXITCODE -ne 0) { throw '1.0.7 source preparation failed' }
          python work/make_brand.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource build failed' }
      - name: Rust tests and optimized binary
        working-directory: work/project
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          rustup target add x86_64-pc-windows-msvc --toolchain stable
          if ($LASTEXITCODE -ne 0) { throw 'Target setup failed' }
          cargo +stable generate-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile failed' }
          cargo +stable test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo +stable build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed' }
      - name: Chromium UI regression and mouse gesture tests
        working-directory: work
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed' }
          python test_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Package precompiled installer
        id: package
        working-directory: work
        env:
          GO111MODULE: 'off'
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          Copy-Item project/target/x86_64-pc-windows-msvc/release/hwigoat-rust.exe prebuilt.exe
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Installer vet failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = [regex]::Match((Get-Content project/Cargo.toml -Raw),'(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (!$v) { throw 'Invalid package version' }
          if (!(Select-String -Path setup.go -SimpleMatch ('const version = "' + $v + '"'))) { throw 'Installer version mismatch' }
          $name = "Hwigoat_Rust_Setup_v${v}_x64.exe"
          if ($env:UPDATE_PUBLIC_KEY) { if ([Convert]::FromBase64String($env:UPDATE_PUBLIC_KEY).Length -ne 32) { throw 'Invalid update public key' } }
          go build -trimpath -ldflags "-s -w -X main.updatePublicKey=$env:UPDATE_PUBLIC_KEY" -o "dist/$name" .
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item project/Cargo.lock dist/Cargo.lock
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/update-public-key.txt'), [string]$env:UPDATE_PUBLIC_KEY, [System.Text.Encoding]::ASCII)
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii dist/SHA256.txt
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Hwigoat-Rust-Windows-x64
          path: work/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: UI-test-previews
          path: |
            work/frame.png
            work/preview.png
          if-no-files-found: error
  draft:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.draft_release))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Hwigoat-Rust-Windows-x64
          path: dist
      - name: Sign release manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" && test -n "$UPDATE_PUBLIC_KEY"
          test "$(cat dist/update-public-key.txt)" = "$UPDATE_PUBLIC_KEY"
          python -m pip install cryptography
          python ci/sign_release.py "$VERSION" dist
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving all assets untouched. Bump version to publish a new update."
            exit 0
          fi
          notes="release-notes/v$VERSION.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing version-specific release notes: $notes"
            exit 1
          fi
          gh release create "v$VERSION" dist/*.exe dist/SHA256.txt dist/Cargo.lock dist/update.json dist/update.sig --repo "$REPO" --target "$COMMIT" --title "Hwigoat Rust $VERSION | Public Beta" --draft --prerelease --notes-file "$notes"
